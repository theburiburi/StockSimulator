spring:
  application:
    name: stockSimulator

  # datasource는 application과 같은 라인에 있어야 합니다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "016777334309c0768a382f4ef0920ffa"
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stock_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:3239}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 60
      minimum-idle: 30
      connection-timeout: 30000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:10000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:150}
          max-idle: ${REDIS_POOL_MAX_IDLE:50}
          min-idle: ${REDIS_POOL_MIN_IDLE:10}
          max-wait: ${REDIS_POOL_MAX_WAIT:5000ms}

# 서버 포트 설정 (spring 소속이 아니므로 맨 앞으로 붙입니다)
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 150
    accept-count: 3000
    max-connections: 15000

# JWT 설정
jwt:
  secret: ${JWT_SECRET:StockSimulatorSecretKeyForJWTHS256AlgorithmMustBe256BitsLong!!}
  expiration: ${JWT_EXPIRATION:86400000}  # 24시간 (ms)
