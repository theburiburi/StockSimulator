spring:
  application:
    name: stockSimulator

  # datasource는 application과 같은 라인에 있어야 합니다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: "016777334309c0768a382f4ef0920ffa"
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: jdbc:mysql://localhost:3306/stock_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root  # 만약 연결 에러가 나면 본인의 MySQL 계정명으로 바꿔보세요.
    password: "3239"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 60
      minimum-idle: 30
      connection-timeout: 30000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 150
          max-idle: 50
          min-idle: 10
          max-wait: 5000ms

# 서버 포트 설정 (spring 소속이 아니므로 맨 앞으로 붙입니다)
server:
  port: 8080
  tomcat:
    threads:
      max: 150
    accept-count: 3000
    max-connections: 15000

# JWT 설정
jwt:
  secret: "StockSimulatorSecretKeyForJWTHS256AlgorithmMustBe256BitsLong!!"
  expiration: 86400000  # 24시간 (ms)