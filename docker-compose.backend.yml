services:
  backend:
    build:
      context: ./stockSimulator_BackEnd
    image: stocksim-backend:latest
    container_name: stocksim-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-stock_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-3239}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-StockSimulatorSecretKeyForJWTHS256AlgorithmMustBe256BitsLong!!}
    networks:
      - stocksim-net

networks:
  stocksim-net:
    external: true
    name: stocksim-net
